<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Solve &amp; Draw · حلّ وارسم | Riwaq</title>
<meta name="description" content="Free maths game for grades 1–3: solve the sum, join the dots and watch Qatar appear. By Riwaq.">
<meta name="theme-color" content="#2563EB">
<link rel="icon" href="img/riwaq-logo.png">
<style>
@font-face{font-family:GSB;src:url(fonts/GSB.woff2) format('woff2');font-display:swap}
@font-face{font-family:GSM;src:url(fonts/GSM.woff2) format('woff2');font-display:swap}
@font-face{font-family:GE,GSB;src:url(fonts/GB.otf) format('opentype');font-display:swap}
@font-face{font-family:GEL;src:url(fonts/GL.otf) format('opentype');font-display:swap}
:root{--blue:#2563EB;--blue2:#1d4fd0;--black:#0d0d10;--ink:#16213d;--grey:#e8eaf0;--grey2:#c3c8d4;--yellow:#ffd23f;--red:#ff5a5f;--maroon:#8A1538;--green:#22c55e}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--black);color:#fff;font-family:GSB,GE,system-ui,sans-serif;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body.ar{font-family:GE,GSB,system-ui,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
.lab{font-family:GSM,GE,sans-serif;letter-spacing:.16em;text-transform:uppercase;font-size:13px}
.ar .lab{font-family:GEL,GE,sans-serif;letter-spacing:0;text-transform:none;font-size:16px}
.pill{display:inline-flex;align-items:center;gap:8px;border:2.5px solid currentColor;border-radius:999px;padding:8px 16px;font-family:GSM,GE;font-size:15px;white-space:nowrap;line-height:1}
.ar .pill{font-family:GE,GSB;font-size:16px}
.logo{height:38px;width:auto;filter:brightness(0) invert(1)}
.wrapx{max-width:1360px;margin:0 auto;padding:0 clamp(16px,4.5vw,64px)}

/* ---------------- HERO */
.hero{position:relative;background:var(--blue);padding:26px 0 0;overflow:hidden}
.hero .wrapx{position:relative;min-height:760px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative;z-index:5}
.nav .links{display:flex;gap:10px;align-items:center}
.lang{background:#fff;color:var(--ink);border-color:#fff}
.lang b{background:var(--ink);color:#fff;border-radius:99px;padding:3px 9px}
.lang span{padding:3px 4px}
.tag{margin-top:64px}
h1{font-size:clamp(76px,13vw,196px);line-height:.86;letter-spacing:-.03em;margin-top:22px;position:relative;z-index:2}
h1 .out{display:block;color:transparent;-webkit-text-stroke:clamp(2px,.3vw,4px) #fff}
.ar h1{line-height:1.08;letter-spacing:0;font-size:clamp(84px,14vw,210px)}
.sub{margin-top:26px;position:relative;z-index:2}
.ar .sub{font-size:24px}
.circles{display:flex;gap:14px;margin-top:34px;flex-wrap:wrap;position:relative;z-index:2}
.circles span{width:88px;height:88px;border-radius:50%;background:#fff;border:4px solid var(--ink);display:grid;place-items:center;box-shadow:0 6px 0 rgba(0,0,0,.18);animation:float 3.2s ease-in-out infinite}
.circles span:nth-child(2n){animation-delay:-1.4s}.circles span:nth-child(3n){animation-delay:-2.1s}
.circles img{max-width:64px;max-height:64px}
@keyframes float{50%{transform:translateY(-6px) rotate(-3deg)}}
.cta{display:flex;gap:14px;margin-top:36px;flex-wrap:wrap;position:relative;z-index:2;padding-bottom:70px}
.btn{font-size:20px;border-radius:999px;padding:16px 28px;border:4px solid var(--ink);display:inline-flex;gap:10px;align-items:center;transition:transform .12s}
.btn:active{transform:translateY(3px)}
.btn.y{background:var(--yellow);color:var(--ink);box-shadow:6px 6px 0 var(--ink)}
.btn.o{border-color:#fff;color:#fff}
.kids{position:absolute;bottom:-12px;inset-inline-end:0;display:flex;align-items:flex-end;gap:6px;z-index:3;pointer-events:none}
.kids img{filter:drop-shadow(0 14px 0 rgba(0,0,0,.22))}
.kids .b{height:600px;animation:bob 4s ease-in-out infinite}.kids .g{height:560px;animation:bob 4s ease-in-out infinite -2s}
@keyframes bob{50%{transform:translateY(-8px)}}
.spark{position:absolute;color:var(--yellow);font-size:54px;z-index:1;animation:twk 2.4s ease-in-out infinite}
.dotd{position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;z-index:1}
@keyframes twk{50%{transform:scale(.7) rotate(45deg);opacity:.6}}
@media (max-width:1100px){.kids .b{height:440px}.kids .g{height:410px}.hero .wrapx{min-height:0}}
@media (max-width:820px){.kids{position:relative;justify-content:center;margin-top:6px;inset:auto}.kids .b{height:330px}.kids .g{height:305px}.cta{padding-bottom:10px}.tag{margin-top:40px}.nav .links .hide-s{display:none}.circles span{width:64px;height:64px}.circles img{max-width:46px;max-height:46px}}

/* ---------------- ALBUM */
.band{position:relative;background:var(--black);padding:34px 0 60px}
.rule{display:flex;justify-content:space-between;align-items:center;gap:16px;border-top:2px solid #2c2c33;border-bottom:2px solid #2c2c33;padding:14px 0;color:#cfd3dc;flex-wrap:wrap}
.ghost{position:absolute;top:110px;inset-inline-start:2vw;font-size:clamp(70px,12vw,170px);color:transparent;-webkit-text-stroke:1.6px #34343e;white-space:nowrap;letter-spacing:-.02em;pointer-events:none;z-index:0;line-height:1}
.ar .ghost{letter-spacing:0}
.head{position:relative;z-index:1;display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-top:110px}
.head h2{font-size:clamp(44px,6vw,66px);line-height:1}
.ar .head h2{line-height:1.25}
.head .small{color:#9aa0ac;margin-bottom:10px}
.prog{display:flex;align-items:center;gap:12px;margin-top:14px}
.prog .bar{width:min(320px,60vw);height:12px;border-radius:9px;background:#26262e;overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--yellow);border-radius:9px;transition:width .6s}
.row2{position:relative;z-index:1;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-top:28px}
.tabs,.grades,.packs{display:flex;gap:8px;flex-wrap:wrap}
.grades .pill,.packs .pill{color:#fff}
.on.pill{background:var(--yellow);border-color:var(--yellow);color:var(--ink)!important}
.tabs .pill{font-size:17px;padding:11px 20px}
.tabs .pill.on{background:#fff;border-color:#fff}
.tabs .pill small{font-size:12px;opacity:.7}
.packs{margin-top:14px;position:relative;z-index:1}
.packs .pill{border-color:#3a3a44;padding:7px 14px;font-size:14px}
.cards{position:relative;z-index:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px;margin-top:24px}
.card{background:#fff;border-radius:26px;padding:12px;color:var(--ink);text-align:start;transition:transform .15s;position:relative}
.card:hover{transform:translateY(-4px) rotate(-.6deg)}
.card .art{aspect-ratio:1.25;border-radius:18px;display:grid;place-items:center;position:relative;overflow:hidden}
.card .art img,.card .art canvas{max-height:82%;max-width:80%;object-fit:contain}
.card .n{position:absolute;top:10px;inset-inline-start:10px;background:var(--ink);color:#fff;font-size:12px;border-radius:99px;padding:5px 11px;letter-spacing:.08em}
.card .badge{position:absolute;top:10px;inset-inline-end:10px;background:var(--yellow);color:var(--ink);font-size:12px;border-radius:99px;padding:5px 10px;font-family:GSB,GE}
.card .row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px 6px 4px}
.card .nm{font-size:22px;line-height:1.1}
.ar .card .nm{font-size:22px;line-height:1.35}
.card .meta{color:#5c6478;margin-top:6px;font-size:12px}
.card .go{flex:0 0 46px;height:46px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:22px}
.ar .card .go{transform:scaleX(-1)}
.c1{background:var(--blue)}.c2{background:var(--grey)}.c3{background:var(--yellow)}
@media (max-width:600px){.cards{grid-template-columns:1fr 1fr;gap:12px}.card{border-radius:20px;padding:8px}.card .art{border-radius:14px}
  .card .nm,.ar .card .nm{font-size:16px}.card .go{display:none}.card .row{padding:10px 4px 2px}.card .meta{font-size:10px;letter-spacing:.06em}
  .tabs .pill{font-size:14px;padding:9px 14px}.grades .pill{font-size:13px;padding:7px 12px}.head{margin-top:80px}}
.foot{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-top:56px;color:#9aa0ac}
.foot .logo{height:28px}

/* ---------------- PLAY */
#play{position:fixed;inset:0;background:var(--black);z-index:20;display:flex;flex-direction:column}
#play.hide,.ov.hide{display:none}
.ptop{flex:0 0 auto;height:72px;background:var(--blue);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 clamp(12px,3vw,36px)}
.ptop .t{font-size:24px;display:flex;align-items:center;gap:14px;min-width:0}
.ptop .t span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptop .r{display:flex;gap:8px;align-items:center}
.ptop .pill{font-size:14px;padding:7px 13px}
.ptop .star{background:var(--yellow);color:var(--ink);border-color:var(--yellow)}
.circ{width:44px;height:44px;border-radius:50%;background:#fff;color:var(--ink);display:grid;place-items:center;font-size:20px;flex:0 0 44px}
.pmain{flex:1 1 auto;display:flex;gap:22px;padding:22px clamp(12px,3vw,36px);min-height:0}
.board{flex:1 1 58%;background:#fff;border-radius:30px;position:relative;overflow:hidden;min-height:0;
  background-image:linear-gradient(#eef0f5 1.5px,transparent 1.5px),linear-gradient(90deg,#eef0f5 1.5px,transparent 1.5px);background-size:34px 34px}
.board.vox{background:linear-gradient(#cfe0ff,#f4f7ff 70%)}
.board canvas{position:absolute;inset:0;width:100%;height:100%}
.board .blab{position:absolute;top:16px;inset-inline-start:16px;color:var(--ink);background:var(--grey);border-radius:99px;padding:7px 14px;z-index:2}
.side{flex:0 1 42%;display:flex;flex-direction:column;gap:16px;min-height:0;max-width:560px}
.q{background:var(--blue);border-radius:30px;padding:22px 26px 26px;position:relative}
.q .bar{height:12px;border-radius:9px;background:rgba(255,255,255,.25);margin-top:12px;overflow:hidden}
.q .bar i{display:block;height:100%;width:0;background:var(--yellow);border-radius:9px;transition:width .45s}
.eq{font-size:clamp(54px,7vw,100px);line-height:1.05;margin-top:16px;direction:ltr;white-space:nowrap;text-align:center}
.ar .eq.arabic{direction:rtl}
.eq .qm{color:var(--yellow)}
.word{font-size:clamp(22px,2.3vw,30px);line-height:1.35;margin-top:14px;text-align:center}
.ar .word{line-height:1.6}
.word b{color:var(--yellow);font-weight:normal;display:block}
.pearls{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:16px auto 2px;max-width:360px}
.pearl{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 20%,#f4efe6 45%,#d8cdbc 100%);border:3px solid var(--ink)}
.ans{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ans.n3{grid-template-columns:1fr 1fr 1fr}
.ans button{background:#fff;color:var(--ink);border:5px solid var(--ink);border-radius:24px;height:clamp(78px,11vh,112px);display:grid;place-items:center;font-size:clamp(38px,4.6vw,58px);box-shadow:0 7px 0 #000;position:relative;transition:transform .1s,opacity .4s}
.ans button:active{transform:translateY(4px);box-shadow:0 3px 0 #000}
.ans button.wrong{background:#ffe1e2;border-color:var(--red);color:var(--red);box-shadow:0 7px 0 #8f1f24;animation:shake .4s;opacity:.38;pointer-events:none}
.ans button.wrong:after{content:'✕';position:absolute;top:-14px;inset-inline-end:-12px;width:36px;height:36px;border-radius:50%;background:var(--red);color:#fff;font-size:18px;display:grid;place-items:center;border:3px solid #fff}
.ans button.right{background:var(--yellow);transform:scale(1.04)}
.ans button.hint{animation:pulse .8s infinite}
@keyframes shake{20%,60%{transform:translateX(-8px) rotate(-2deg)}40%,80%{transform:translateX(8px) rotate(2deg)}}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(255,210,63,.55),0 7px 0 #000}}
.hintt{color:#9aa0ac;text-align:center}
.buddy{position:absolute;bottom:0;inset-inline-end:14px;display:flex;align-items:flex-start;gap:4px;z-index:3;pointer-events:none}
.buddy img{height:clamp(140px,22vh,220px);transform-origin:bottom center}
.buddy img.hop{animation:hop .5s}
@keyframes hop{40%{transform:translateY(-16px) rotate(-4deg)}}
.bubble{background:#fff;color:var(--ink);font-size:18px;border:4px solid var(--ink);border-radius:20px;padding:10px 16px;margin-top:16px;white-space:nowrap;transition:transform .2s}
.bubble.pop{animation:pop .35s}
@keyframes pop{40%{transform:scale(1.15)}}
@media (max-aspect-ratio:1/1){
  .pmain{flex-direction:column;gap:12px;padding:12px}
  .board{flex:1 1 auto}
  .side{flex:0 0 auto;max-width:none;gap:10px}
  .q{padding:12px 18px 16px;border-radius:24px}
  .eq{font-size:clamp(44px,11vw,72px);margin-top:8px}
  .word{font-size:clamp(18px,4.6vw,24px);margin-top:8px}
  .ans{gap:10px}.ans button{height:clamp(62px,8vh,90px);font-size:clamp(30px,8vw,46px);border-width:4px;border-radius:20px}
  .buddy{bottom:auto;top:74px;inset-inline-end:16px}.buddy img{height:96px}.bubble{font-size:14px;padding:6px 10px;margin-top:6px;border-width:3px}
  .board .blab{top:auto;bottom:12px}
  .hintt{display:none}
  .ptop{height:62px}.ptop .t{font-size:19px}.ptop .lv{display:none}
}
@media (max-width:420px){.ptop .t img{display:none}}

/* ---------------- OVERLAYS */
.ov{position:fixed;inset:0;z-index:30;background:rgba(13,13,16,.86);display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:28px 14px 40px}
.panel{width:100%;max-width:620px;background:#fff;color:var(--ink);border-radius:32px;padding:26px 24px 28px;text-align:center;position:relative;animation:rise .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes rise{from{transform:translateY(40px) scale(.94);opacity:0}}
.panel .kick{color:var(--blue);margin-bottom:6px}
.panel .big{font-size:clamp(34px,6vw,50px);line-height:1.05}
.ar .panel .big{line-height:1.4}
.panel .pic{height:min(42vh,320px);margin:14px auto 6px;display:grid;place-items:center;background:var(--blue);border-radius:24px;position:relative;overflow:hidden}
.panel .pic img,.panel .pic canvas{position:absolute;inset:0;margin:auto;max-width:86%;max-height:86%;object-fit:contain;animation:wig 2.6s ease-in-out infinite}
@keyframes wig{25%{transform:rotate(-3deg) scale(1.03)}75%{transform:rotate(3deg)}}
.panel .stars{font-size:46px;color:var(--yellow);-webkit-text-stroke:2px var(--ink);letter-spacing:6px;direction:ltr}
.panel .stars i{display:inline-block;font-style:normal;animation:sp .5s backwards}
.panel .stars i:nth-child(2){animation-delay:.15s}.panel .stars i:nth-child(3){animation-delay:.3s}
@keyframes sp{from{transform:scale(0) rotate(-90deg)}}
.fact{background:var(--grey);border-radius:20px;padding:14px 18px;margin-top:12px;text-align:start}
.fact .lab{color:var(--blue);font-size:12px}
.ar .fact .lab{font-size:15px}
.fact p{font-family:GSM,GE;font-size:20px;line-height:1.45;margin-top:4px}
.ar .fact p{font-family:GE,GSB;line-height:1.8;font-size:20px}
.got{margin-top:12px;color:#5c6478}
.quiz{margin-top:14px}.quiz p{font-size:21px;margin-bottom:10px}
.quiz .opts{display:flex;gap:10px;justify-content:center}
.quiz .opts button{width:72px;height:68px;border:4px solid var(--ink);border-radius:18px;font-size:32px;box-shadow:0 5px 0 #000;background:#fff}
.quiz .opts button.right{background:var(--yellow)}.quiz .opts button.wrong{opacity:.3}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.btns .btn{font-size:18px;padding:13px 22px;border-width:4px}
.btns .btn.k{background:var(--ink);color:#fff}
.btns .btn.w{background:#fff;color:var(--ink)}
.teach{text-align:start}.teach h3{font-size:30px;margin-bottom:10px}.teach p,.teach li{font-family:GSM,GE;font-size:17px;line-height:1.55;margin-top:8px}
.ar .teach p,.ar .teach li{font-family:GE,GSB;line-height:1.9}
.teach ul{padding-inline-start:20px}
.x{position:absolute;top:14px;inset-inline-end:14px;width:42px;height:42px;border-radius:50%;background:var(--grey);font-size:20px}
body.still .panel,body.still .panel *{animation:none!important}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
</style>
</head>
<body>

<!-- ======================= HOME -->
<section class="hero"><div class="wrapx">
  <div class="nav">
    <img class="logo" src="img/riwaq-logo.png" alt="Riwaq">
    <div class="links">
      <a class="pill hide-s" href="#album" data-t="navAlbum"></a>
      <button class="pill hide-s" data-act="teach" data-t="navTeach"></button>
      <button class="pill lang" id="langBtn"></button>
    </div>
  </div>
  <div class="tag"><span class="pill lab" data-t="tag"></span></div>
  <h1><span data-t="h1a"></span><span class="out" data-t="h1b"></span></h1>
  <div class="sub lab" data-t="sub"></div>
  <div class="circles" id="circles"></div>
  <div class="cta"><a class="btn y" href="#album" data-t="go"></a><button class="btn o" data-act="build" data-t="goBuild"></button></div>
  <span class="spark" style="top:150px;inset-inline-end:44%">+</span><span class="spark" style="top:430px;inset-inline-end:3%;animation-delay:-1s">+</span>
  <span class="dotd" style="top:250px;inset-inline-end:40%"></span><span class="dotd" style="top:610px;inset-inline-end:46%;background:var(--yellow)"></span>
  <div class="kids"><img class="b" src="img/boy.webp" alt=""><img class="g" src="img/girl.webp" alt=""></div>
</div></section>

<section class="band" id="album"><div class="wrapx">
  <div class="rule lab"><span data-t="rule"></span><span data-t="rule2"></span></div>
  <div class="ghost" data-t="ghost"></div>
  <div class="head">
    <div><div class="small lab" data-t="small"></div><h2 data-t="pick"></h2>
      <div class="prog"><div class="bar"><i id="progBar"></i></div><span class="lab" id="progTxt"></span></div></div>
    <div class="grades" id="grades"></div>
  </div>
  <div class="row2"><div class="tabs" id="tabs"></div></div>
  <div class="packs" id="packs"></div>
  <div class="cards" id="cards"></div>
  <div class="foot lab"><img class="logo" src="img/riwaq-logo.png" alt="Riwaq"><span data-t="rule2"></span><span>riwaqqatar.github.io/tools</span></div>
</div></section>

<!-- ======================= PLAY -->
<div id="play" class="hide">
  <div class="ptop">
    <div class="t"><img class="logo" src="img/riwaq-logo.png" alt=""><span id="pTitle"></span></div>
    <div class="r"><span class="pill lv" id="pLevel"></span><span class="pill star" id="pStars"></span>
      <button class="circ" id="sndBtn" aria-label="sound"></button><button class="circ" id="digBtn" aria-label="digits"></button><button class="circ" id="homeBtn" aria-label="home">⌂</button></div>
  </div>
  <div class="pmain">
    <div class="board" id="board"><span class="blab lab" id="bLab"></span><canvas id="cv"></canvas></div>
    <div class="side">
      <div class="q"><div class="lab" id="qn"></div><div class="bar"><i id="qbar"></i></div><div id="qbody"></div></div>
      <div class="ans" id="ans"></div>
      <div class="hintt lab" id="hintt"></div>
    </div>
  </div>
  <div class="buddy"><div class="bubble" id="bubble"></div><img id="buddyImg" src="img/boy.webp" alt=""></div>
</div>

<!-- ======================= DONE -->
<div class="ov hide" id="done"><div class="panel">
  <div class="kick lab" id="dKick"></div><div class="big" id="dTitle"></div>
  <div class="pic" id="dPic"></div>
  <div class="stars" id="dStars"></div>
  <div class="fact"><div class="lab" data-t="didYou"></div><p id="dFact"></p></div>
  <div class="quiz" id="dQuiz"></div>
  <div class="got lab" id="dGot"></div>
  <div class="btns"><button class="btn y" id="dNext"></button><button class="btn w" id="dAgain"></button><button class="btn k" id="dAlbum"></button></div>
</div></div>

<!-- ======================= TEACHERS -->
<div class="ov hide" id="teach"><div class="panel teach"><button class="x" data-act="close">✕</button><div id="teachBody"></div></div></div>

<canvas id="fx"></canvas>
<script src="data.js"></script>
<script src="pics.js"></script>
<script src="vox.js"></script>
<script src="app.js"></script>
</body>
</html>
